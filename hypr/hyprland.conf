# ==============================================================================
# Hyprland Configuration
# Aesthetic: Catppuccin Mocha with Frosted Glass Blur, Rounded Corners & Shadows
# Hardware: ThinkPad T14s Gen 2 (Intel Iris Xe)
# Full Muscle-Memory Parity with macOS (AeroSpace) & Sway
# ==============================================================================

# Monitor configuration (Built-in 14" 1080p display)
monitor=,preferred,auto,1

# ==============================================================================
# Autostart Services
# ==============================================================================

# D-Bus & Systemd environment import for screen sharing and portals
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Wallpaper (Catppuccin landscape)
exec-once = swaybg -i /home/jakem/Pictures/wallpapers/catppuccin-shaded-landscape.png -m fill

# Status bar & Notifications
exec-once = waybar
exec-once = dunst

# Clipboard history daemon (wl-paste + cliphist)
exec-once = wl-paste --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Polkit authentication agent
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Idle & Screen Lock
exec-once = hypridle || swayidle -w timeout 300 'hyprlock || swaylock -f -c 1e1e2e'

# ==============================================================================
# Input & Trackpad Configuration (ThinkPad T14s)
# ==============================================================================

input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        middle_button_emulation = true
        clickfinger_behavior = false
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# ==============================================================================
# General Layout & Styling (Catppuccin Mocha Borders & Gaps)
# ==============================================================================

general {
    gaps_in = 6
    gaps_out = 10
    border_size = 3

    # Dynamic Catppuccin Blue to Mauve gradient border
    col.active_border = rgba(89b4faff) rgba(cba6f7ff) 45deg
    col.inactive_border = rgba(313244aa)

    layout = dwindle
    allow_tearing = false
}

# ==============================================================================
# Decoration: Transparency, Frosted Glass Blur & Drop Shadows
# ==============================================================================

decoration {
    # Rounded corners matching macOS JankyBorders (10px)
    rounding = 10

    # Opacity
    active_opacity = 1.0
    inactive_opacity = 0.94

    # Frosted Glass Kawase Blur
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
        ignore_opacity = true
    }

    # Soft drop shadows
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(181825ee)
    }
}

# ==============================================================================
# Fluid Bezier Animations
# ==============================================================================

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5, easeOutQuint
    animation = windows, 1, 4.5, easeOutQuint
    animation = windowsIn, 1, 4, easeOutQuint, popin 85%
    animation = windowsOut, 1, 2, linear, popin 85%
    animation = fadeIn, 1, 2, almostLinear
    animation = fadeOut, 1, 2, almostLinear
    animation = fade, 1, 3, quick
    animation = layers, 1, 3.8, easeOutQuint
    animation = workspaces, 1, 4.2, easeInOutCubic, slide
}

# ==============================================================================
# Layout Logic
# ==============================================================================

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true
}

# ==============================================================================
# Window & Layer Rules (Frosted Glass Blur on Waybar & Rofi)
# ==============================================================================

# Frosted blur behind Waybar and Rofi launcher
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, rofi
layerrule = ignorezero, rofi

# Floating rules for dialogs and utility tools
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueberry.py)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(galculator)$
windowrulev2 = float, title:^(About.*)$
windowrulev2 = float, title:^(Open File.*)$
windowrulev2 = float, title:^(Select a File.*)$

# Window opacity rules (ensures Ghostty has semi-transparent background)
windowrulev2 = opacity 0.92 0.88, class:^(com.mitchellh.ghostty)$
windowrulev2 = opacity 0.92 0.88, class:^(ghostty)$

# ==============================================================================
# Keybindings: Core Actions & Launchers
# ==============================================================================

$mainMod = SUPER

# Start Terminal (Ghostty)
bind = $mainMod, Return, exec, ghostty
bind = CTRL ALT, Return, exec, ghostty

# Kill active window
bind = $mainMod, Q, killactive,
bind = CTRL ALT, W, killactive,

# Fullscreen
bind = $mainMod, F, fullscreen, 0
bind = CTRL ALT, F, fullscreen, 0

# Toggle Floating
bind = $mainMod SHIFT, Space, togglefloating,
bind = CTRL ALT, Space, togglefloating,

# App Launchers & Helpers
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod, T, exec, rofi -show window
bind = $mainMod, C, exec, cliphist list | rofi -dmenu -p 'Clipboard' | cliphist decode | wl-copy
bind = $mainMod, W, exec, firefox
bind = $mainMod, N, exec, thunar

# Session & Lock
bind = $mainMod CTRL, L, exec, hyprlock || swaylock -f -c 1e1e2e
bind = $mainMod SHIFT, X, exec, hyprlock || swaylock -f -c 1e1e2e
bind = $mainMod SHIFT, E, exit,

# ==============================================================================
# Navigation & Movement (IJKL Layout matching macOS AeroSpace)
# ==============================================================================

# Move focus (IJKL)
bind = $mainMod, J, movefocus, l
bind = $mainMod, K, movefocus, d
bind = $mainMod, I, movefocus, u
bind = $mainMod, L, movefocus, r

# Move focus (AeroSpace Ctrl+Alt IJKL)
bind = CTRL ALT, J, movefocus, l
bind = CTRL ALT, K, movefocus, d
bind = CTRL ALT, I, movefocus, u
bind = CTRL ALT, L, movefocus, r

# Move focus (Arrow keys fallback)
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r

# Move window (IJKL)
bind = $mainMod SHIFT, J, movewindow, l
bind = $mainMod SHIFT, K, movewindow, d
bind = $mainMod SHIFT, I, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Move window (AeroSpace Ctrl+Alt+Shift IJKL)
bind = CTRL ALT SHIFT, J, movewindow, l
bind = CTRL ALT SHIFT, K, movewindow, d
bind = CTRL ALT SHIFT, I, movewindow, u
bind = CTRL ALT SHIFT, L, movewindow, r

# Move window (Arrow keys fallback)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r

# ==============================================================================
# Workspaces
# ==============================================================================

# Switch to workspace 1-10 ($mainMod + 1..0)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Switch to workspace 1-9 (AeroSpace Ctrl + Alt + 1..9)
bind = CTRL ALT, 1, workspace, 1
bind = CTRL ALT, 2, workspace, 2
bind = CTRL ALT, 3, workspace, 3
bind = CTRL ALT, 4, workspace, 4
bind = CTRL ALT, 5, workspace, 5
bind = CTRL ALT, 6, workspace, 6
bind = CTRL ALT, 7, workspace, 7
bind = CTRL ALT, 8, workspace, 8
bind = CTRL ALT, 9, workspace, 9

# Move active window to workspace 1-10 ($mainMod + Shift + 1..0)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move active window to workspace 1-9 (AeroSpace Ctrl + Alt + Shift + 1..9)
bind = CTRL ALT SHIFT, 1, movetoworkspace, 1
bind = CTRL ALT SHIFT, 2, movetoworkspace, 2
bind = CTRL ALT SHIFT, 3, movetoworkspace, 3
bind = CTRL ALT SHIFT, 4, movetoworkspace, 4
bind = CTRL ALT SHIFT, 5, movetoworkspace, 5
bind = CTRL ALT SHIFT, 6, movetoworkspace, 6
bind = CTRL ALT SHIFT, 7, movetoworkspace, 7
bind = CTRL ALT SHIFT, 8, movetoworkspace, 8
bind = CTRL ALT SHIFT, 9, movetoworkspace, 9

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ==============================================================================
# Hardware / Media Keys (ThinkPad T14s)
# ==============================================================================

# Backlight keys
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Audio volume keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media control keys
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshots (grim + slurp)
bind = , Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +'%Y-%m-%d-%H%M%S_screenshot.png') && notify-send "Screenshot Captured" "Saved to ~/Pictures/Screenshots/"
bind = $mainMod SHIFT, Print, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d-%H%M%S_screenshot.png') && notify-send "Area Screenshot Captured" "Saved to ~/Pictures/Screenshots/"
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot Copied" "Copied to clipboard."
