# ==============================================================================
# Hyprlock Configuration (Catppuccin Mocha)
# ==============================================================================

background {
    monitor =
    path = /home/jakem/Pictures/wallpapers/catppuccin-shaded-landscape.png
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(137, 180, 250, 1) # $blue
    inner_color = rgba(24, 24, 37, 0.9)  # $mantle
    font_color = rgba(205, 214, 244, 1)  # $text
    fade_on_empty = false
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(205, 214, 244, 1) # $text
    font_size = 64
    font_family = MesloLGS NF Bold
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(180, 190, 254, 1) # $lavender
    font_size = 20
    font_family = MesloLGS NF
    position = 0, 40
    halign = center
    valign = center
}
